[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nishaan-backend"
version = "0.1.0"
description = "Nishaan: AI crime scene and suspect sketch generator backend (CPU-only, free-tier cloud AI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  "slowapi>=0.1.9",
  "cryptography>=42",
  "httpx>=0.27",
  "google-genai>=1.0",
  "mediapipe>=0.10.21",
  "numpy>=1.26",
  "scikit-image>=0.23",
  "pillow>=10.3",
  "jsonpatch>=1.33",
  "reportlab>=4.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008", "B904"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["alembic/", ".venv/", "data/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app.core", "app.services"]
# The default C tracer misses lines run under SQLAlchemy's greenlet bridge; sys.monitoring
# (Python 3.12+) measures async service code correctly.
core = "sysmon"

[tool.coverage.report]
skip_covered = true
show_missing = true
